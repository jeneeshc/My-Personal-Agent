$schema: "http://json-schema.org/draft-07/schema#"
title: SecretaryAgentProtocol
description: Specification for inter-agent routing, message processing, worker delegation, and response synthesis in the Multi-Agent system.
type: object
definitions:
  ProcessMessageInput:
    type: object
    required:
      - message
      - sender_id
    properties:
      message:
        type: string
        description: Raw text of the incoming user request.
      sender_id:
        type: string
        description: Unique identifier of the user (e.g. WhatsApp phone number).
      context_overrides:
        type: object
        description: Optional transient context overrides (e.g., timezone, active flow).

  IntentClassification:
    type: object
    required:
      - primary_intent
      - target_agent
      - confidence
    properties:
      primary_intent:
        type: string
        enum:
          - calendar_travel
          - news_info
          - email_summarize
          - stock_business
          - money_manager
          - health_wellness
          - shopping
          - document_drive
          - general_conversation
      target_agent:
        type: string
        enum:
          - TaskTravelManager
          - NewsCollector
          - EmailAgent
          - StockAgent
          - MoneyManager
          - HealthAgent
          - ShoppingAssistant
          - DocumentManager
          - DirectSecretary
      confidence:
        type: number
        minimum: 0.0
        maximum: 1.0

  AgentDelegationPayload:
    type: object
    required:
      - delegation_id
      - target_agent
      - user_id
      - action
      - payload
    properties:
      delegation_id:
        type: string
        format: uuid
      target_agent:
        type: string
      user_id:
        type: string
      action:
        type: string
      payload:
        type: object

  AgentResponseSynthesis:
    type: object
    required:
      - delegation_id
      - success
      - final_reply_text
    properties:
      delegation_id:
        type: string
      success:
        type: boolean
      final_reply_text:
        type: string
      metadata:
        type: object

  AgentProcessState:
    type: object
    required:
      - agent_name
      - status
      - consecutive_crashes
      - max_consecutive_crashes
    properties:
      agent_name:
        type: string
      status:
        type: string
        enum:
          - HEALTHY
          - RESTARTING
          - FAILED_MAX_RETRIES
      consecutive_crashes:
        type: integer
        minimum: 0
      max_consecutive_crashes:
        type: integer
        default: 5
      last_error:
        type: string

